name: Generate Charon-enabled rust-analyzer core self-docs

on:
  workflow_dispatch:
  push:
    branches:
      - formal/05-charon-frontend-self-docs-core
    paths:
      - '.github/charon-frontend-self-docs.trigger'

permissions:
  contents: write

concurrency:
  group: formal-charon-frontend-self-docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    name: Generate rust-analyzer LLBC, Rocq/Coq, and HOL4
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require a branch ref
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "branch" ]]; then
            echo "This workflow must run on a branch so generated files can be committed back." >&2
            exit 2
          fi

      - name: Install exact prebuilt Aeneas and Charon release
        shell: bash
        run: |
          set -euo pipefail
          source formal/rust-analyzer-aeneas/toolchain.env

          archive="${RUNNER_TEMP}/aeneas-release.tar.gz"
          dist="${RUNNER_TEMP}/aeneas-release"
          url="https://github.com/AeneasVerif/aeneas/releases/download/${AENEAS_RELEASE_TAG}/aeneas-linux-x86_64.tar.gz"

          curl --fail --location --retry 3 --output "${archive}" "${url}"
          echo "${AENEAS_LINUX_X86_64_SHA256}  ${archive}" | sha256sum --check -

          mkdir -p "${dist}"
          tar -xzf "${archive}" -C "${dist}"
          chmod +x "${dist}/aeneas" "${dist}/charon" "${dist}/charon-driver"

          aeneas_version="$("${dist}/aeneas" -version)"
          [[ "${aeneas_version}" == "aeneas ${AENEAS_RELEASE_TAG}" ]] || {
            echo "Aeneas release mismatch: ${aeneas_version}" >&2
            exit 3
          }

          charon_version="$("${dist}/charon" version)"
          [[ "${charon_version}" == *"${CHARON_REV}"* || "${charon_version}" == *"${CHARON_REV:0:7}"* ]] || {
            echo "Charon release mismatch: ${charon_version}; expected ${CHARON_REV}" >&2
            exit 4
          }

          echo "CHARON_BIN=${dist}/charon" >> "${GITHUB_ENV}"
          echo "AENEAS_BIN=${dist}/aeneas" >> "${GITHUB_ENV}"

      - name: Generate dedicated self-documentation
        id: generate
        shell: bash
        run: |
          set +e
          bash scripts/formal/generate-charon-frontend-self-docs.sh
          status=$?
          set -e
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Commit dedicated generated documents
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A formal/rust-analyzer-aeneas/architectures/charon-frontend/generated

          if git diff --cached --quiet; then
            echo "Dedicated generated documentation is already up to date."
            exit 0
          fi

          source_commit="$(git rev-parse --short=12 HEAD)"
          git commit -m "formal: generate Charon frontend self-docs for ${source_commit}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Report incomplete translation
        if: steps.generate.outputs.status != '0'
        shell: bash
        run: |
          echo "One or more Charon/Aeneas translations failed. Partial dedicated documents, manifests, and logs were committed." >&2
          exit "${{ steps.generate.outputs.status }}"

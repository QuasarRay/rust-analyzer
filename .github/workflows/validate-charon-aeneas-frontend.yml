name: Validate Charon Aeneas frontend

on:
  workflow_dispatch:
  push:
    branches:
      - feature/charon-aeneas-frontend
    paths:
      - '.github/charon-aeneas-frontend.trigger'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup update --no-self-update stable
          rustup default stable

      - name: Check rust-analyzer binary
        run: cargo check -p rust-analyzer --bin rust-analyzer

      - name: Run Aeneas LLBC frontend unit tests
        run: cargo test -p rust-analyzer aeneas_llbc --lib

      - name: Install Nix
        uses: cachix/install-nix-action@v31.10.6
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify emitted LLBC is consumed by pinned Aeneas
        run: bash scripts/formal/check-rust-analyzer-aeneas-contract.sh
